# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The review rules that must not vary between Bymax
# repositories are edited there; everything this repository writes for itself
# lives outside the markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review — it
# reads neither CLAUDE.md nor anything under .github/instructions/ — so a shared
# rule has to exist as a real file here rather than be referenced. That is why
# this is a sync and not a `uses:` for the rules themselves: the reusable CI this
# repository calls propagates by reference, this one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly, off the hour and on an hour no other scheduled workflow here uses,
    # so the runs do not cluster.
    - cron: '17 7 * * 1'
  workflow_dispatch:

# Single-flight across the repository, deliberately NOT keyed by `github.ref`.
# What two runs contend over is one synchronisation branch and one pull request,
# so a ref-scoped group would put a dispatch and a scheduled run in different
# groups and leave the race intact. Queue rather than cancel: the called workflow
# force-pushes under a lease, so a concurrent run loses the race by failing the
# job rather than by corrupting the branch — a red run nobody can act on.
concurrency:
  group: agents-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # Named rather than `inherit`, so the called workflow receives these two
      # and not every secret this repository holds.
      #
      # A GitHub App rather than a token: the installation token is minted per
      # run and expires within the hour, so there is no long-lived credential to
      # rotate and none to expire unnoticed. Both secrets are organisation-level
      # with `all repositories` visibility, and bymax-agents-sync is installed
      # org-wide, so this repository holds no secret of its own.
      #
      # Supplied together or not at all — the called workflow fails a half pair
      # explicitly rather than falling back, because a silent fallback there is
      # indistinguishable from having configured nothing.
      #
      # `sync-token` is deliberately left unmapped rather than kept alongside
      # these. Mapping a secret that does not exist resolves to the empty string,
      # and the called workflow falls back to the default GITHUB_TOKEN while the
      # file reads as configured. That fallback cannot work here: this
      # organisation runs with `can_approve_pull_request_reviews: false`, which
      # no workflow file overrides, so the default token may not open a pull
      # request at all — a run that finds drift pushes its branch and then fails.
      # An App installation token may.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
