# pnpm settings for this repository.
#
# These live here rather than in `.npmrc` because `auto-install-peers` is a pnpm
# key: npm reads `.npmrc` too and warns "Unknown project config" on every
# invocation, including the `npm pack` that `check:exports` runs.
#
# Do not materialise optional peer dependencies into this repo's lockfile.
# The library declares 18 optional peers so consumers can pick a provider or a
# store, but it imports none of them: every integration goes through an
# interface, and even the bundled reference adapters are structurally typed and
# load their SDK through a dynamic import(). With pnpm's default
# `autoInstallPeers: true`, all 18 were installed as direct dependencies of the
# workspace root — dragging in nodemailer, mjml (and its unmaintained
# html-minifier), twilio, firebase-admin and the AWS SDKs, none of which any
# source, test or script touches. That surface produced every Dependabot alert
# on this repository, for code never executed here and never published.
#
# The required peers are declared as devDependencies, so they stay installed and
# the gates keep running. Peers that a devDependency needs must be declared
# explicitly too — see @testing-library/dom, required by @testing-library/react.
autoInstallPeers: false

# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  # jest-haste-map 30.5.0 declares @parcel/watcher as a direct, non-optional
  # dependency, so a jest bump past 30.4.2 drags it in and `pnpm install` exits
  # with ERR_PNPM_IGNORED_BUILDS until it is listed. Recorded here before that
  # bump lands: the entry describes what this repository allows, not what its
  # lockfile currently contains.
  #
  # Denied rather than allowed, and the two are NOT interchangeable. The install
  # script is `if (process.env.npm_config_build_from_source === 'true') { build() }`
  # — under an ordinary install it spawns nothing, so `true` would compile nothing
  # and `false` costs nothing. They diverge only under a deliberate source build,
  # which is the node-gyp rebuild this entry exists to refuse.
  #
  # Nothing here needs the native watcher: `test:watch` is a local convenience and
  # no workflow runs a watcher. The prebuilt per-platform packages cover the load
  # path; on a platform outside them the require throws under `true` as well,
  # because an ordinary install compiled no fallback.
  #
  # Positioned where pnpm writes its own placeholder, so a future rewrite is a
  # no-op rather than a reordering diff.
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  # GHSA-5p4m-2wfm-xmqj (CVSS 7.5) — quadratic CPU while resolving !!omap.
  # Transitive and build-time only; patched rather than ignored, because a
  # scanner told to skip dev dependencies stays blind after this one is gone.
  #
  # GHSA-2883-xcg3-v3hh (CVSS 7.5) is fixed in 3.15.2 and 4.3.2. Reached through
  # @istanbuljs/load-nyc-config (3.x) and cosmiconfig (4.x).
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.2'
  'brace-expansion@1': '^1.1.18'
  # GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7 (CVSS 7.5 each) and
  # GHSA-q2hr-2g5m-vwhr (CVSS 5.3). The fix lands at a different patch in each
  # major, so the two floors differ: 2.1.7 and 5.0.12. Reached
  # through minimatch under eslint, jest and the build tooling.
  'brace-expansion@2': '^2.1.7'
  'brace-expansion@5': '^5.0.12'
  'esbuild': '^0.28.1'
  # GHSA-8r5x-fm3f-whwj (CVSS 9.8), GHSA-p8wg-vrv2-v86f (CVSS 9.2) and
  # GHSA-xw65-4hp5-5hc7 (CVSS 4.7). Fixed in 4.7.10; reached
  # through ts-jest, dev-time only. The package.json peer range is untouched: the
  # advisory is about the copy this repository installs, not the one consumers pick.
  'handlebars@4': '^4.7.10'
  # GHSA-mrhx-c7xc-m3w5 (CVSS 8.2) — fixed in 4.6.6; reached through
  # mutation-server-protocol under @stryker-mutator. That package's own range
  # (^4.1.12) already admits the fix, so the floor only keeps the lockfile from
  # holding an older resolution.
  'zod@4': '^4.6.6'
  # Floors raised 2026-09-03, not new entries. Both were already pinned here for
  # earlier advisories; the carets would have admitted the fixed versions, but
  # the lockfile held the older resolution, so the range alone protected nothing.
  #
  # fast-uri: GHSA-5jgf-p345-68v8 and three siblings (CVSS 7.5, published
  # 2026-09-02) — host confusion via skipped IDN canonicalisation. Vulnerable at
  # >= 3.1.3 < 3.1.6; reached through ajv under @stryker-mutator.
  #
  # GHSA-58mr-gqgx-xq4g and GHSA-qw65-cvwx-89v3 (CVSS 7.5) are fixed in 3.1.7, and
  # the later siblings (GHSA-hrr3-gc8f-f4qj,
  # GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr,
  # GHSA-xhq7-xmqj-769h) in 3.1.9.
  'fast-uri@3': '^3.1.9'
  # qs: GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx (published 2026-09-02) —
  # denial of service via an attacker-controlled isBuffer. Vulnerable at
  # >= 2.2.5 < 6.16.0; reached through typed-rest-client under @stryker-mutator.
  #
  # GHSA-6pq8-jhm2-2vcw (CVSS 6.3) is fixed in 6.16.1.
  'qs@6': '^6.16.1'
  # GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx (CVSS 7.5 each, published
  # 2026-09-01) — an uncaught crash with a prototype write, and unbounded memory
  # growth, both reached through an untrusted browserslist query. Vulnerable at
  # <= 4.28.6; the lockfile carried 4.28.2, pulled in transitively by
  # @stryker-mutator through @babel/core. Dev-time only and patched rather than
  # ignored, for the same reason as the entries above: a scanner told to skip dev
  # dependencies stays blind after this one is gone. Nothing caps the floor —
  # @babel/helper-compilation-targets declares ^4.24.0.
  browserslist: '^4.28.7'
