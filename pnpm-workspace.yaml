# pnpm settings for this repository.
#
# These live here rather than in `.npmrc` because `auto-install-peers` is a pnpm
# key: npm reads `.npmrc` too and warns "Unknown project config" on every
# invocation, including the `npm pack` that `check:exports` runs.
#
# Do not materialise optional peer dependencies into this repo's lockfile.
# The library declares 18 optional peers so consumers can pick a provider or a
# store, but it imports none of them: every integration goes through an
# interface, and even the bundled reference adapters are structurally typed and
# load their SDK through a dynamic import(). With pnpm's default
# `autoInstallPeers: true`, all 18 were installed as direct dependencies of the
# workspace root — dragging in nodemailer, mjml (and its unmaintained
# html-minifier), twilio, firebase-admin and the AWS SDKs, none of which any
# source, test or script touches. That surface produced every Dependabot alert
# on this repository, for code never executed here and never published.
#
# The required peers are declared as devDependencies, so they stay installed and
# the gates keep running. Peers that a devDependency needs must be declared
# explicitly too — see @testing-library/dom, required by @testing-library/react.
autoInstallPeers: false

# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  # GHSA-5p4m-2wfm-xmqj (CVSS 7.5) — quadratic CPU while resolving !!omap.
  # Transitive and build-time only; patched rather than ignored, because a
  # scanner told to skip dev dependencies stays blind after this one is gone.
  'js-yaml@3': '^3.15.1'
  'js-yaml@4': '^4.3.1'
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'
  'esbuild': '^0.28.1'
  'fast-uri': '^3.1.5'
  'qs': '^6.15.2'
  # GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx (CVSS 7.5 each, published
  # 2026-09-01) — an uncaught crash with a prototype write, and unbounded memory
  # growth, both reached through an untrusted browserslist query. Vulnerable at
  # <= 4.28.6; the lockfile carried 4.28.2, pulled in transitively by
  # @stryker-mutator through @babel/core. Dev-time only and patched rather than
  # ignored, for the same reason as the entries above: a scanner told to skip dev
  # dependencies stays blind after this one is gone. Nothing caps the floor —
  # @babel/helper-compilation-targets declares ^4.24.0.
  browserslist: '^4.28.7'
